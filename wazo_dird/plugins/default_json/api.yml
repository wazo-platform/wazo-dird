paths:
  /directories/lookup/{profile}:
    get:
      summary: Search for contacts
      description: '**Required ACL:** `dird.directories.lookup.{profile}.read`


        The `lookup` query will return a list of result matching the searched term.
        The result will be retrieved from all configured directories for the given
        profile.



        This route is provided by the `default_json_view` plugin using the `lookup`
        plugin and all configured sources for the given profile.'
      operationId: lookup
      tags:
      - directories
      responses:
        '200':
          description: A list of contacts
          schema:
            $ref: '#/definitions/Lookup'
        '404':
          $ref: '#/responses/NotFound'
        '503':
          $ref: '#/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/parameters/tenantuuid'
      - $ref: '#/parameters/Profile'
      - $ref: '#/parameters/Term'
  /directories/lookup/{profile}/{user_uuid}:
    get:
      summary: Search for contacts for a particular user
      description: '**Required ACL:** `dird.directories.lookup.{profile}.{user_uuid}.read`


        The `lookup` query will return a list of result matching the searched term.
        The result will be retrieved from all configured directories for the given
        profile and user.



        This route is provided by the `default_json_view` plugin using the `lookup`
        plugin and all configured sources for the given profile.'
      operationId: lookup_user
      tags:
      - directories
      responses:
        '200':
          description: A list of contacts
          schema:
            $ref: '#/definitions/Lookup'
        '404':
          $ref: '#/responses/NotFound'
        '503':
          $ref: '#/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/parameters/tenantuuid'
      - $ref: '#/parameters/Profile'
      - $ref: '#/parameters/UserUUID'
      - $ref: '#/parameters/Term'
  /directories/reverse/{profile}/{user_uuid}:
    get:
      summary: Search for contact by number
      description: '**Required ACL:** `dird.directories.reverse.{profile}.{user_uuid}.read`


        The `reverse` query will return a contact matching the searched exten. The
        result will be retrieved from all configured directories for the given profile.



        This route is provided by the `default_json_view` plugin using the `reverse`
        plugin and all configured sources for the given profile.'
      operationId: reverse
      tags:
      - directories
      responses:
        '200':
          description: A contact
          schema:
            $ref: '#/definitions/Reverse'
        '503':
          $ref: '#/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/parameters/tenantuuid'
      - $ref: '#/parameters/Profile'
      - $ref: '#/parameters/UserUUID'
      - $ref: '#/parameters/Exten'
  /directories/favorites/{profile}:
    get:
      summary: List favorite contacts
      description: '**Required ACL:** `dird.directories.favorites.{profile}.read`


        Get the list of favorite contacts for directories configured in the profile'
      operationId: list_favorites
      tags:
      - directories
      - favorites
      responses:
        '200':
          description: A list of contacts
          schema:
            $ref: '#/definitions/ContactList'
        '404':
          $ref: '#/responses/NotFound'
        '503':
          $ref: '#/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/parameters/tenantuuid'
      - $ref: '#/parameters/Profile'
  /directories/favorites/{directory}/{contact}:
    put:
      summary: Mark a contact as favorite
      description: '**Required ACL:** `dird.directories.favorites.{directory}.{contact}.update`


        Add the contact from {directory} to the list of favorite contacts.'
      operationId: add_favorite
      tags:
      - directories
      - favorites
      responses:
        '204':
          description: Favorite added.
        '400':
          $ref: '#/responses/InvalidData'
        '404':
          $ref: '#/responses/NotFound'
        '409':
          $ref: '#/responses/Conflict'
        '503':
          $ref: '#/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/parameters/tenantuuid'
      - $ref: '#/parameters/Directory'
      - $ref: '#/parameters/FavoriteID'
    delete:
      summary: Unmark a contact as favorite
      description: '**Required ACL:** `dird.directories.favorites.{directory}.{contact}.delete`


        Remove the contact from {directory} from the list of favorite contacts.'
      operationId: remove_favorite
      tags:
      - directories
      - favorites
      responses:
        '204':
          description: Favorite removed.
        '404':
          $ref: '#/responses/NotFound'
        '503':
          $ref: '#/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/parameters/tenantuuid'
      - $ref: '#/parameters/Directory'
      - $ref: '#/parameters/FavoriteID'
  /directories/personal/{profile}:
    get:
      summary: List personal contacts with formatting
      description: '**Required ACL:** `dird.directories.personal.{profile}.read`


        Get the list of personal contacts formatted for the profile'
      operationId: list_personal_profile
      tags:
      - directories
      - personal
      responses:
        '200':
          description: A list of contacts
          schema:
            $ref: '#/definitions/PhonebookContactList'
        '404':
          $ref: '#/responses/NotFound'
        '503':
          $ref: '#/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/parameters/tenantuuid'
      - $ref: '#/parameters/Profile'

  /directories/contacts:
    get:
      summary: List every contact of the tenant
      description: '**Required ACL:** `dird.directories.contacts.read`


        Every contact of the token''s tenant, from every source of the lookup,
        reverse and favorites services of all its profiles, each source listed
        once. The tenant is the token''s own: a `Wazo-Tenant` header does not
        change it. With a user token, the user''s personal contacts are listed and
        their favorites flagged.


        Contacts are sorted by source name, then by contact id. A source that
        fails or does not answer within the configured timeout is left out of the
        page and named in `missing_sources`: `total` and the offsets of that page
        can then differ from the next one''s.


        This route is provided by the `default_json_view` plugin using the `lookup`
        plugin.'
      operationId: list_directory_contacts
      tags:
      - directories
      parameters:
      - name: limit
        in: query
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
        description: The number of contacts returned
        required: false
      - name: offset
        in: query
        type: integer
        minimum: 0
        default: 0
        description: The number of contacts to skip
        required: false
      responses:
        '200':
          description: A page of contacts
          schema:
            $ref: '#/definitions/DirectoryContactList'
        '400':
          $ref: '#/responses/InvalidData'
        '401':
          description: The token is invalid, lacks the ACL or cannot see the Wazo-Tenant
          schema:
            $ref: '#/definitions/Error'
        '503':
          $ref: '#/responses/ServiceUnavailable'

definitions:
  DirectoryContactList:
    properties:
      items:
        type: array
        items:
          $ref: '#/definitions/DirectoryContact'
      total:
        type: integer
        description: The number of contacts of every page
      missing_sources:
        type: array
        description: The names of the sources left out of this page because they
          failed or timed out
        items:
          type: string
  DirectoryContact:
    properties:
      source:
        type: string
      backend:
        type: string
      fields:
        type: object
        description: The contact's fields as the source returns them
      relations:
        $ref: '#/definitions/Relation'
      favorite:
        type: boolean
        description: Whether the user of the token marked this contact favorite
      personal:
        type: boolean
        description: Whether this is a personal contact of the user of the token
  ContactList:
    properties:
      column_headers:
        type: array
        description: Labels for the headers
        items:
          type: string
      column_types:
        type: array
        description: Data types for the headers
        items:
          type: string
      results:
        items:
          $ref: '#/definitions/Contact'
        type: array
        description: List of results
  Lookup:
    allOf:
      - $ref: '#/definitions/ContactList'
      - properties:
          term:
            type: string
            description: Search term used for these results
