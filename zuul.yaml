- project:
    templates:
      - wazo-tox-linters-py311
      - wazo-tox-py311
      - debian-packaging-bookworm
    wazo-check:
      jobs:
        - dird-tox-integration
        - dird-check-db-schema
    wazo-gate:
      jobs:
        - dird-tox-integration
        - dird-check-db-schema

- job:
    name: dird-tox-integration
    description: Run dird integration tests
    parent: wazo-tox-integration-py311
    timeout: 10800
    vars:
      integration_test_timeout: 60

- job:
    name: dird-check-db-schema
    description: Compare the schema of the models with the one the migrations install
    parent: wazo-tox-py311
    pre-run: zuul.d/pre-run.yaml
    post-run: zuul.d/fetch-logs.yaml
    vars:
      tox_envlist: check-db-schema
